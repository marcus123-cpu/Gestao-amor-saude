name: Publicar instalador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar ferramentas
        shell: pwsh
        run: |
          python -m pip install -r installer/requirements-build.txt
          npm ci
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup não foi instalado.' }
      - name: Conferir código
        shell: pwsh
        run: |
          python -m pytest -q test_app.py test_workflow.py
          if ($LASTEXITCODE -ne 0) { throw 'Testes falharam.' }
          node --check app.js
          node --check workflow.js
      - name: Instalar navegador
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            .\node_modules\.bin\playwright.cmd install chromium
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Chromium não foi baixado.' }
          }
      - name: Montar instalador
        shell: pwsh
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
        run: .\installer\build-release.ps1 -Version $env:RELEASE_VERSION
      - name: Publicar atualização
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: 1.0.${{ github.run_number }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $installer = "release\AgendaClara-Setup-$env:RELEASE_VERSION.exe"
          $checksum = "$installer.sha256"
          gh release create $tag $installer $checksum --target $env:GITHUB_SHA --title "Agenda Clara $env:RELEASE_VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Publicação da versão falhou.' }
